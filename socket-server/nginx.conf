# Nginx负载均衡配置文件
# 适用于Socket.IO高并发集群部署

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 10240;  # 每个工作进程的最大连接数
    use epoll;                # 使用epoll事件模型
    multi_accept on;          # 允许一次接受多个连接
    accept_mutex off;         # 关闭accept互斥锁，提高性能
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # 基础配置
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # 文件上传大小限制
    client_max_body_size 10M;
    client_body_buffer_size 128k;
    client_header_buffer_size 3m;
    large_client_header_buffers 4 256k;

    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # 限流配置
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

    # Socket.IO上游服务器配置
    upstream socketio_backend {
        # 使用ip_hash确保sticky sessions
        ip_hash;

        # 服务器实例列表
        server 127.0.0.1:3001 max_fails=3 fail_timeout=30s weight=1;
        server 127.0.0.1:3002 max_fails=3 fail_timeout=30s weight=1;
        server 127.0.0.1:3003 max_fails=3 fail_timeout=30s weight=1;

        # 健康检查
        keepalive 32;
    }

    # API服务上游服务器配置
    upstream api_backend {
        least_conn;
        server 127.0.0.1:4001 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:4002 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:4003 max_fails=3 fail_timeout=30s;

        keepalive 32;
    }

    # 主服务器配置
    server {
        listen 80;
        listen [::]:80;
        server_name your-domain.com www.your-domain.com;

        # 重定向到HTTPS
        return 301 https://$server_name$request_uri;
    }

    # HTTPS服务器配置
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name your-domain.com www.your-domain.com;

        # SSL证书配置
        ssl_certificate /etc/ssl/certs/your-domain.crt;
        ssl_certificate_key /etc/ssl/private/your-domain.key;

        # SSL安全配置
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # HSTS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # 安全头
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 连接限制
        limit_conn conn_limit_per_ip 20;

        # Socket.IO代理配置
        location /socket.io/ {
            # 限流
            limit_req zone=api burst=50 nodelay;

            # 代理到Socket.IO服务器集群
            proxy_pass http://socketio_backend;

            # WebSocket代理配置
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 代理超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
            send_timeout 3600s;

            # 缓存设置
            proxy_cache_bypass $http_upgrade;
            proxy_no_cache $http_upgrade;

            # 缓冲设置
            proxy_buffering off;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;

            # 错误处理
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 30s;
        }

        # API代理配置
        location /api/ {
            # 限流
            limit_req zone=api burst=20 nodelay;

            # 代理到API服务器集群
            proxy_pass http://api_backend;

            # 标准HTTP代理配置
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 连接池
            proxy_set_header Connection "";

            # 超时设置
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # 缓冲设置
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;

            # 错误处理
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 30s;
        }

        # 静态文件服务
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;

            # 缓存设置
            expires 1y;
            add_header Cache-Control "public, immutable";

            # 静态文件压缩
            gzip_static on;

            # 尝试静态文件，否则返回index.html (SPA支持)
            try_files $uri $uri/ /index.html;
        }

        # 健康检查端点
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # 禁止访问敏感文件
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # 监控和管理接口
    server {
        listen 127.0.0.1:8080;

        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }

        location /metrics {
            # Prometheus metrics
            access_log off;
            allow 127.0.0.1;
            deny all;

            # 这里可以集成nginx-prometheus-exporter
            proxy_pass http://localhost:9113/metrics;
        }
    }
}

